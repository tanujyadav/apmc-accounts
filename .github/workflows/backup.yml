name: Daily database backup

on:
  schedule:
    # 20:00 UTC = 01:30 IST — runs once a day, free on GitHub Actions
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install postgresql-client (matches Neon's server version)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p backups
          STAMP=$(date -u +%Y-%m-%d)
          pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip > "backups/apmc-backup-$STAMP.sql.gz"
          # Fail loudly instead of committing an empty/near-empty dump.
          SIZE=$(stat -c%s "backups/apmc-backup-$STAMP.sql.gz")
          if [ "$SIZE" -lt 200 ]; then
            echo "::error::Backup file is suspiciously small ($SIZE bytes) — pg_dump likely produced no data."
            exit 1
          fi

      - name: Delete backups older than 90 days
        run: |
          find backups -name '*.sql.gz' -mtime +90 -delete

      - name: Commit backup
        run: |
          git config user.name "apmc-backup-bot"
          git config user.email "actions@github.com"
          git add backups
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: daily database backup $(date -u +%Y-%m-%d)"
          git push

